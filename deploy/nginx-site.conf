# Upstream blocks: extensible to load balancing later just by adding
# more "server" lines here (e.g. more app droplets), no other config changes needed.
upstream frontend_app {
    server 127.0.0.1:3000;
}

upstream backend_fpm {
    server unix:/run/php/php8.3-fpm.sock;
}

server {
    listen 80 default_server;
    server_name 207.154.206.122;

    root /var/www/loan-app/kcb-loan-backend/public;
    index index.php;

    client_max_body_size 20m;
    limit_req zone=perip burst=30 nodelay;
    limit_conn addrconn 30;

    access_log /var/log/nginx/loan-app.access.log;
    error_log  /var/log/nginx/loan-app.error.log;

    # Payment-initiation gets its own, more generous timeout budget and a
    # tighter rate limit (money-moving endpoint), separate from the general API.
    # Next.js's own API route (analytics/telemetry) - not part of Laravel's API,
    # must be carved out before the general /api block claims everything.
    location = /api/events {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/initiate-payment {
        limit_req zone=payments burst=5 nodelay;
        try_files $uri /api/index.php?$query_string;
    }

    location /api {
        try_files $uri $uri/ /api/index.php?$query_string;
    }

    location ~ ^/api/index\.php(/.*)?$ {
        fastcgi_pass backend_fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60;
        fastcgi_next_upstream error timeout invalid_header http_500;
    }

    location ~ \.php$ {
        return 404;
    }

    location /_next/static/ {
        proxy_pass http://frontend_app;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
